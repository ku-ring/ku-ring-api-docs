openapi: 3.0.1
info:
  title: Kuring API
  version: v2
  description: "### \U0001F393 건국대 공지사항 알림 서비스 '쿠링'의 공식 API 명세서입니다.    \n이 문서는 **Kuring 프로젝트**의 백엔드 기능을 정의합니다. \n\n* **담당자**: 쿠링 팀 (kuring.korea@gmail.com)\n* **문서 업데이트**: 2026-01-21"
  contact:
    name: Github
    url: 'https://github.com/ku-ring'
    email: kuring.korea@gmail.com
  termsOfService: 'https://github.com/ku-ring'
  license:
    name: MIT
    url: 'https://opensource.org/licenses/MIT'
# 1. 보안 설정 및 공통 파라미터 (Try it / 문서 도구에서 헤더·인증 입력란 노출용)
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 액세스 토큰 (로그인 후 발급)
  parameters:
    UserTokenHeaderRequired:
      name: User-Token
      in: header
      required: true
      schema:
        type: string
      description: FCM 기반 사용자 기기 식별 토큰
      example: '1234'
    UserTokenHeaderOptional:
      name: User-Token
      in: header
      required: false
      schema:
        type: string
      description: FCM 기반 사용자 기기 식별 토큰
      example: '1234'
  responses:
    UnauthorizedJwt:
      description: 인증 실패 (JWT 만료/없음/유효하지 않음)
      content:
        application/json:
          schema:
            $ref: ./components/schemas/common/ErrorResponse.yaml
          example:
            isSuccess: false
            resultCode: 401
            resultMsg: 유효하지 않거나 만료된 토큰입니다.
    BadRequestUserToken:
      description: 잘못된 요청 (User-Token 누락/형식 오류 등)
      content:
        application/json:
          schema:
            $ref: ./components/schemas/common/ErrorResponse.yaml
          example:
            isSuccess: false
            resultCode: 400
            resultMsg: User-Token이 필요하거나 올바르지 않습니다.
tags:
  - name: Academic
    description: 학사일정 API
  - name: Admin
    description: 관리자 전용 API
  - name: AI
    description: AI 챗봇 API
  - name: Club
    description: 교내 동아리 정보 조회 및 관리 API
  - name: Deprecated
    description: ⚠️ 곧 삭제될 예정인 API입니다. 신규 개발 시 사용을 지양하세요.
  - name: Draft
    description: 설계 초안 단계입니다. 실제 호출이 불가능하거나 구조가 변경될 수 있습니다.
  - name: Notice
    description: 공지사항 관련 API
  - name: Report
    description: 신고 기능 API
  - name: Staff
    description: 교직원 검색 API
  - name: User
    description: 사용자 관련 API
  - name: Verification
    description: 이메일 인증 API
# 2. API 경로 정의
paths:
  # ------------------------------------------------------------------
  # [로그인/인증]
  # ------------------------------------------------------------------
  /api/v2/users/login:
    post:
      tags:
        - User
      summary: 사용자 로그인
      description: 사용자가 이메일과 비밀번호로 로그인하여 액세스 토큰을 발급받습니다.
      operationId: login
      parameters:
        - $ref: '#/components/parameters/UserTokenHeaderOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/user/UserLoginRequest.yaml
            examples:
              Success:
                value:
                  email: user@konkuk.ac.kr
                  password: '1234'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ./components/schemas/common/BaseResponse.yaml
                  - type: object
                    properties:
                      data:
                        $ref: ./components/schemas/user/UserLoginResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 로그인되었습니다.
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ...
        '400':
          $ref: '#/components/responses/BadRequestUserToken'
  /api/v2/users/logout:
    post:
      tags:
        - User
      summary: 사용자 로그아웃
      description: 현재 로그인된 사용자의 세션을 만료시키고 토큰을 무효화합니다.
      operationId: logout
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserTokenHeaderRequired'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common/BaseResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 로그아웃되었습니다.
                    data: null
        '400':
          $ref: '#/components/responses/BadRequestUserToken'
        '401':
          $ref: '#/components/responses/UnauthorizedJwt'
  /api/v2/users/signup:
    post:
      tags:
        - User
      summary: 사용자 회원가입
      description: FCM 디바이스 토큰을 포함하여 새로운 사용자를 회원가입 처리합니다.
      operationId: signup
      parameters:
        - $ref: '#/components/parameters/UserTokenHeaderOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/user/UserSignupRequest.yaml
            examples:
              Success:
                value:
                  email: user@konkuk.ac.kr
                  password: '1234'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common/BaseResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 회원가입이 완료되었습니다.
                    data: null
        '400':
          $ref: '#/components/responses/BadRequestUserToken'
  /api/v2/users/withdraw:
    delete:
      tags:
        - User
      summary: 사용자 회원 탈퇴
      description: 로그인된 사용자의 계정을 삭제하고 모든 관련 데이터를 정리합니다.
      operationId: withdraw
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common/BaseResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 탈퇴가 완료되었습니다.
                    data: null
        '401':
          $ref: '#/components/responses/UnauthorizedJwt'
  /api/v2/users/password:
    patch:
      tags:
        - User
      summary: 사용자 비밀번호 변경
      description: 로그인된 사용자가 비밀번호를 새 값으로 변경합니다.
      operationId: modifyPassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/user/UserPasswordModifyRequest.yaml
            examples:
              Success:
                value:
                  email: user@konkuk.ac.kr
                  password: '5678'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common/BaseResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 비밀번호가 변경되었습니다.
                    data: null
        '401':
          $ref: '#/components/responses/UnauthorizedJwt'
  # ------------------------------------------------------------------
  # [사용자 정보]
  # ------------------------------------------------------------------
  /api/v2/users/user-me:
    get:
      tags:
        - User
      summary: 사용자 정보 조회
      description: 현재 로그인된 사용자의 프로필 정보를 조회합니다.
      operationId: lookupUserInfo
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ./components/schemas/common/BaseResponse.yaml
                  - type: object
                    properties:
                      data:
                        $ref: ./components/schemas/user/UserInfoResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 조회되었습니다.
                    data:
                      email: kuring@konkuk.ac.kr
                      nickname: 쿠링이
        '401':
          $ref: '#/components/responses/UnauthorizedJwt'
  /api/v2/users/ask-counts:
    get:
      tags:
        - User
      summary: 사용자 질문 가능횟수 조회
      description: 오늘 남은 AI 질문 횟수와 하루 최대 질문 가능 횟수를 조회합니다.
      operationId: lookupUserAIAskCount
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserTokenHeaderOptional'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ./components/schemas/common/BaseResponse.yaml
                  - type: object
                    properties:
                      data:
                        $ref: ./components/schemas/user/UserAIAskCountResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 조회되었습니다.
                    data:
                      leftAskCount: 3
                      maxAskCount: 10
        '400':
          $ref: '#/components/responses/BadRequestUserToken'
        '401':
          $ref: '#/components/responses/UnauthorizedJwt'
  # ------------------------------------------------------------------
  # [구독 및 알림]
  # ------------------------------------------------------------------
  /api/v2/users/subscriptions/departments:
    get:
      tags:
        - User
      summary: 사용자 학과 조회
      description: 사용자가 구독 중인 학과 목록을 조회합니다.
      operationId: lookupUserSubscribeDepartments
      parameters:
        - $ref: '#/components/parameters/UserTokenHeaderRequired'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ./components/schemas/common/BaseResponse.yaml
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: ./components/schemas/user/UserDepartmentNameResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 조회되었습니다.
                    data:
                      - name: computer_cse
                        hostPrefix: cse
                        korName: 컴퓨터공학부
        '400':
          $ref: '#/components/responses/BadRequestUserToken'
    post:
      tags:
        - User
      summary: 사용자 학과 수정
      description: 사용자가 구독할 학과 목록을 추가·수정합니다.
      operationId: editUserSubscribeDepartments
      parameters:
        - $ref: '#/components/parameters/UserTokenHeaderRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/user/UserDepartmentsSubscribeRequest.yaml
            examples:
              Success:
                value:
                  departments:
                    - computer_cse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common/BaseResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 학과 구독이 수정되었습니다.
                    data: null
        '400':
          $ref: '#/components/responses/BadRequestUserToken'
  /api/v2/users/subscriptions/categories:
    get:
      tags:
        - User
      summary: 사용자 카테고리 조회
      description: 사용자가 구독 중인 공지 카테고리 목록을 조회합니다.
      operationId: lookupUserSubscribeCategories
      parameters:
        - $ref: '#/components/parameters/UserTokenHeaderRequired'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ./components/schemas/common/BaseResponse.yaml
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: ./components/schemas/user/UserCategoryNameResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 조회되었습니다.
                    data:
                      - name: bachelor
                        hostPrefix: bachelor
                        korName: 학사
        '400':
          $ref: '#/components/responses/BadRequestUserToken'
    post:
      tags:
        - User
      summary: 사용자 카테고리 수정
      description: 사용자가 구독할 공지 카테고리 목록을 추가·수정합니다.
      operationId: editUserSubscribeCategories
      parameters:
        - $ref: '#/components/parameters/UserTokenHeaderRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/user/UserCategoriesSubscribeRequest.yaml
            examples:
              Success:
                value:
                  categories:
                    - bachelor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common/BaseResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 카테고리 구독이 수정되었습니다.
                    data: null
        '400':
          $ref: '#/components/responses/BadRequestUserToken'
  /api/v2/users/notifications/academic-events:
    patch:
      tags:
        - User
      summary: 사용자 학사일정 알림 설정 수정
      description: 사용자의 학사일정 알림 활성화 여부를 변경합니다.
      operationId: updateAcademicEventNotification
      parameters:
        - $ref: '#/components/parameters/UserTokenHeaderRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/user/UserAcademicEventNotificationRequest.yaml
            examples:
              Success:
                value:
                  enabled: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common/BaseResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 학사일정 알림 설정이 변경되었습니다.
                    data: null
        '400':
          $ref: '#/components/responses/BadRequestUserToken'
  # ------------------------------------------------------------------
  # [기타 기능]
  # ------------------------------------------------------------------
  /api/v2/users/feedbacks:
    post:
      tags:
        - User
      summary: 사용자 피드백 작성
      description: 앱 사용성이나 오류 등에 대한 사용자의 피드백을 서버에 전송합니다.
      operationId: saveFeedback
      parameters:
        - $ref: '#/components/parameters/UserTokenHeaderRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/user/UserFeedbackRequest.yaml
            examples:
              Success:
                value:
                  content: 테스트 피드백 내용
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common/BaseResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 피드백이 접수되었습니다.
                    data: null
        '400':
          $ref: '#/components/responses/BadRequestUserToken'
  /api/v2/users/bookmarks:
    get:
      tags:
        - User
      summary: 사용자 북마크 조회
      description: 사용자가 저장해 둔 공지사항 북마크 목록을 조회합니다.
      operationId: lookupUserBookmarks
      parameters:
        - $ref: '#/components/parameters/UserTokenHeaderRequired'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ./components/schemas/common/BaseResponse.yaml
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: ./components/schemas/user/UserBookmarkResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 조회되었습니다.
                    data:
                      - articleId: '51234'
                        postedDate: '2023-10-25'
                        subject: 2023학년도 2학기 수강신청 안내
                        category: bachelor
                        baseUrl: 'https://www.konkuk.ac.kr/do/MessageBoard/...'
        '400':
          $ref: '#/components/responses/BadRequestUserToken'
    post:
      tags:
        - User
      summary: 사용자 북마크 작성
      description: 특정 공지사항을 북마크에 추가합니다.
      operationId: saveBookmark
      parameters:
        - $ref: '#/components/parameters/UserTokenHeaderRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/user/UserBookmarkRequest.yaml
            examples:
              Success:
                value:
                  articleId: '1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common/BaseResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 북마크가 추가되었습니다.
                    data: null
        '400':
          $ref: '#/components/responses/BadRequestUserToken'
  # ------------------------------------------------------------------
  # [공지사항] Notice
  # ------------------------------------------------------------------
  /api/v2/notices:
    get:
      tags:
        - Notice
      summary: 공지사항 목록 조회
      description: 특정 학과나 카테고리의 공지사항 목록을 조회합니다.
      operationId: getNotices
      parameters:
        - name: type
          in: query
          description: '조회 타입 (school=학교공지, dep=학과공지)'
          required: true
          schema:
            type: string
            enum:
              - school
              - dep
            example: dep
        - name: department
          in: query
          description: 학과 코드 (type이 dep일 때 필수)
          schema:
            type: string
            example: computer_cse
        - name: category
          in: query
          description: 카테고리 (type이 school일 때 필수)
          schema:
            type: string
            example: bachelor
        - name: page
          in: query
          description: 페이지 번호 (0부터 시작)
          schema:
            type: integer
            default: 0
            example: 0
        - name: size
          in: query
          description: 페이지 크기
          schema:
            type: integer
            default: 10
            example: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ./components/schemas/common/BaseResponse.yaml
                  - type: object
                    properties:
                      data:
                        $ref: ./components/schemas/notice/NoticeListResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 조회되었습니다.
                    data:
                      notices:
                        - articleId: '56281'
                          postedDate: '2023-10-31'
                          subject: '[학사] 2024학년도 1학기 전과 신청 안내'
                          category: bachelor
                          important: true
                          baseUrl: 'https://www.konkuk.ac.kr/do/MessageBoard/ArticleRead.do?id=56281'
  /api/v2/notices/search:
    get:
      tags:
        - Notice
      summary: 공지사항 키워드 검색
      description: 키워드를 기준으로 학교 및 학과 공지사항을 검색합니다.
      operationId: searchNotices
      parameters:
        - name: content
          in: query
          description: 검색할 키워드 (공백으로 구분)
          required: true
          schema:
            type: string
            example: 장학금
        - name: page
          in: query
          description: 결과 페이지 번호 (0부터 시작)
          schema:
            type: integer
            default: 0
            example: 0
        - name: size
          in: query
          description: 한 페이지에 포함될 결과 개수
          schema:
            type: integer
            default: 10
            example: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ./components/schemas/common/BaseResponse.yaml
                  - type: object
                    properties:
                      data:
                        $ref: ./components/schemas/notice/NoticeListResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 조회되었습니다.
                    data:
                      notices:
                        - articleId: '56281'
                          postedDate: '2023-10-31'
                          subject: '[학사] 2024학년도 1학기 전과 신청 안내'
                          category: bachelor
                          important: true
                          baseUrl: 'https://www.konkuk.ac.kr/do/MessageBoard/ArticleRead.do?id=56281'
  /api/v2/notices/departments:
    get:
      tags:
        - Notice
      summary: 공지 조회 지원 학과 목록
      description: 공지 조회 기능이 지원되는 학과 목록을 조회합니다.
      operationId: getNoticeDepartments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ./components/schemas/common/BaseResponse.yaml
                  - type: object
                    properties:
                      data:
                        $ref: ./components/schemas/notice/NoticeDepartmentListResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 조회되었습니다.
                    data:
                      departments:
                        - name: computer_cse
