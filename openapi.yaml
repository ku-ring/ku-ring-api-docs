  # ------------------------------------------------------------------
  # [동아리] Club
  # ------------------------------------------------------------------
  /api/v2/clubs/divisions:
    get:
      tags:
        - Draft
      summary: 동아리 소속(division) 목록 조회
      description: |
        동아리 소속 목록이 가변적으로 변할 수 있으므로, 클라이언트에 현재 지원하는 소속 목록을 API로 전달합니다.
        필터 UI(드롭다운 등) 구성 시 이 목록을 사용하세요.

        **값 형식:**
        - 서버 내부 데이터는 UPPERCASE로 저장/관리됩니다 (예: CENTRAL, ENGINEERING)
        - 클라이언트와의 API 통신 시에는 lowercase로 변환하여 사용합니다 (예: central, engineering)
        - API 응답의 code 값은 lowercase로 내려갑니다. (예: central, engineering)

        가능한 소속 값 (UPPERCASE 기준):
        - CENTRAL: 중앙 / Central organization under the university
        - LIBERAL_ARTS: 문과대학 / College of Liberal Arts
        - SCIENCE: 이과대학 / College of Science
        - ARCHITECTURE: 건축대학 / College of Architecture
        - ENGINEERING: 공과대학 / College of Engineering
        - SOCIAL_SCIENCES: 사회과학대학 / College of Social Sciences
        - BUSINESS: 경영대학 / College of Business Administration
        - REAL_ESTATE: 부동산과학원 / College of Real Estate
        - KU_CONVERGENCE: KU융합과학기술원 / Konkuk Institute of Technology
        - SANGHUH_LIFE_SCIENCE: 상허생명과학대학 / College of Sang-Huh Life Science
        - VETERINARY: 수의과대학 / College of Veterinary Medicine
        - ART_DESIGN: 예술디자인대학 / College of Art & Design
        - EDUCATION: 사범대학 / College of Education
        - SANGHUH_GENERAL: 상허교양대학 / Sang-Huh College
        - INTERNATIONAL: 국제대학 / International College
        - CONVERGENCE_SCI_TECH: 융합과학기술원 / Institute of Technology
        - LIFE_SCIENCE: 생명과학대학 / College of Life Science
        - COMPUTER_SCIENCE: 컴퓨터공학과 / Department of Computer Science
        - MECHANICAL_ENGINEERING: 기계공학과 / Department of Mechanical Engineering
        - ETC: 기타 / Other or unspecified affiliation
      operationId: getClubDivisions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ./components/schemas/common/BaseResponse.yaml
                  - type: object
                    properties:
                      data:
                        $ref: ./components/schemas/club/ClubDivisionListResponse.yaml
              examples:
                Success:
                  value:
                    code: 200
                    message: 조회되었습니다.
                    data:
                      divisions:
                        - code: central
                          koreanName: 중앙
                        - code: engineering
                          koreanName: 공과대학
                        - code: liberal_arts
                          koreanName: 문과대학
  /api/v2/clubs:
    get:
      tags:
        - Draft
      summary: 동아리 목록 조회
      description: |
        필터 조건에 맞는 동아리 목록을 커서 페이징으로 조회합니다. data 안에 clubs(배열), cursor, hasNext, totalCount를 반환합니다.

        **인증:** Bearer(JWT)와 User-Token(FCM)은 선택(optional)입니다. 로그인하지 않은 사용자도 조회 가능하며, 이 경우 isSubscribed는 모두 false로 반환됩니다. 인증 시 사용자의 구독 여부에 따라 isSubscribed가 반영됩니다.

        필터:
        - category: 동아리 카테고리로 필터 (1개만 선택 가능)
        - division: 동아리 소속으로 필터. 여러 개 선택 시 콤마(,)로 구분하여 전달 (예: division=central,engineering). 생략 시 소속 무관.
          **값 형식:** 서버 내부는 UPPERCASE로 저장되지만, API 요청/응답에서는 lowercase로 전달됩니다. 요청 시 lowercase 값을 보내고, 응답의 division 필드도 lowercase로 반환됩니다.

        페이징:
        - cursor: 다음 페이지 요청 시 사용할 커서. 동아리 ID(pk) 값입니다. 최초 요청 시 생략하거나 0을 전달하면 첫 페이지부터 조회됩니다. 기본값: 0
        - size: 단일 요청의 사이즈. 1 ~ 30까지 허용. 기본값: 20

        정렬:
        - sortBy: 정렬 기준. name (동아리 이름 순) 또는 recruitEndDate (마감일 임박순). 기본값: name
      operationId: getClubs
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/UserTokenHeaderOptional'
        - name: category
          in: query
          description: 동아리 카테고리로 필터 (ClubCategory enum 값 1개)
          required: false
          schema:
            $ref: ./components/schemas/club/ClubCategory.yaml
        - name: division
          in: query
          description: |
            동아리 소속으로 필터. 여러 개 선택 시 콤마(,)로 구분하여 전달합니다. 생략 시 소속 무관.

            **값 형식:** 서버 내부는 UPPERCASE로 저장되지만, API 요청/응답에서는 lowercase로 전달됩니다.
            - 요청 시: lowercase 값 사용 (예: division=central,engineering)
            - 응답 시: division 필드에 lowercase 값 반환 (예: "central", "engineering")
          required: false
          schema:
            type: string
          example: 'central,engineering'
        - name: cursor
          in: query
          description: 다음 페이지 요청 시 사용할 커서 (동아리 ID 값). 최초 요청 시 생략하거나 0 전달 시 첫 페이지부터 조회
          required: false
          schema:
            type: integer
            format: int64
            default: 0
            example: 0
        - name: size
          in: query
          description: '단일 요청의 사이즈, 1 ~ 30까지 허용'
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 30
            default: 20
            example: 20
        - name: sortBy
          in: query
          description: 정렬 기준. name (동아리 이름 순) 또는 recruitEndDate (마감일 임박순)
          required: false
          schema:
            type: string
            enum:
              - name
              - recruitEndDate
            default: name
            example: name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ./components/schemas/common/BaseResponse.yaml
                  - type: object
                    properties:
                      data:
                        $ref: ./components/schemas/club/ClubListResponse.yaml
              examples:
                FirstPageHasNext:
                  summary: '첫 페이지, 다음 페이지 있음'
                  value:
                    code: 200
                    message: 조회되었습니다.
                    data:
                      clubs:
                        - id: 1
                          name: Kuring
                          summary: 건국대학교 공지사항 알림 서비스 개발 동아리
                          iconImageUrl: 'https://api.kuring.com/images/club_icon.png'
                          category: academic
                          division: central
                          isSubscribed: false
                          subscriberCount: 19
                          recruitStartDate: '2026-05-01T00:00:00'
                          recruitEndDate: '2026-06-03T23:59:59'
                        - id: 2
                          name: 리드미
                          summary: 책 속에 빠져 인사이트를 나누는 독서 모임
                          iconImageUrl: 'https://api.kuring.com/images/club_icon_2.png'
