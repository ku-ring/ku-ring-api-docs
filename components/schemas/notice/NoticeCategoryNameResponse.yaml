type: object
description: 공지사항 지원 카테고리 응답
required:
  - name
  - hostPrefix
  - korName
properties:
  name:
    type: string
    description: 카테고리 이름
    example: "bachelor"
  hostPrefix:
    type: string
    description: 카테고리 shortName
    example: "bch"
  korName:
    type: string
    description: 카테고리 한글명
    example: "학사"

