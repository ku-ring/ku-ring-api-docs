type: object
description: 동아리 목록/즐겨찾기 목록 공통 항목 (한 건)
properties:
  id:
    type: integer
    description: 동아리 ID
    example: 1
  name:
    type: string
    description: 동아리 명
    example: Kuring
  summary:
    type: string
    description: 동아리 요약 (한 줄 소개)
    example: 건국대학교 공지사항 알림 서비스 개발 동아리
  iconImageUrl:
    type: string
    description: 동아리 아이콘 이미지 URL
    example: 'https://api.kuring.com/images/club_icon.png'
  category:
    type: string
    description: 동아리 카테고리
    example: OUTDOOR
  division:
    type: string
    description: 동아리 소속 (중앙/단과대 등)
    example: CENTRAL
  bookmarkCount:
    type: integer
    description: 동아리 즐겨찾기 수
    example: 19
  recruitEndDate:
    type: string
    format: date-time
    description: 동아리 모집 마감일
    example: '2026-06-03T23:59:59'
    nullable: true
