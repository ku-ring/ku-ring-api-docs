type: object
description: 동아리 위치 정보
properties:
  building:
    $ref: ./ClubBuilding.yaml
    nullable: true
    description: 동아리방 건물 (snake_case)
  room:
    type: string
    nullable: true
    description: 동아리 방 호수
    example: "101"
  lon:
    type: number
    format: double
    description: 경도 (longitude, WGS84). 지도 마커용. 미제공 시 null
    nullable: true
    example: 127.074
  lat:
    type: number
    format: double
    description: 위도 (latitude, WGS84). 지도 마커용. 미제공 시 null
    nullable: true
    example: 37.541
