type: object
description: 동아리 상세 정보 응답 객체
examples:
  - id: 1
    name: 리드미
    summary: '단순히 책만 읽는 독서모임이 아닌, 책 속에 빠져 인사이트를 나누는 모임'
    category: academic
    division: central
    bookmarkCount: 128
    isBookmarked: true
    instagramUrl: 'https://instagram.com/kuring.official'
    description: 저희 리드미는 2020년부터 시작된...
    qualifications: |-
      건국대학교 재학생 및 휴학생 누구나
      (매주 목요일 활동 가능하신 분)
    recruitmentStatus: recruiting
    recruitStartAt: '2026-03-02T00:00:00'
    recruitEndAt: '2026-03-15T23:59:59'
    applyUrl: 'https://forms.gle/xyz...'
    posterImageUrl: 'https://api.kuring.com/images/club_poster_readme.png'
    location:
      building: sanghuh_library
      room: "101"
      x: 127.074
      y: 37.541
properties:
  id:
    type: integer
    format: int64
    description: 동아리 ID
    example: 1
  # ----------------------------------------
  # [1] 헤더 및 기본 정보
  # ----------------------------------------
  name:
    type: string
    description: '동아리 이름 ({Title})'
    example: 리드미
  summary:
    type: string
    description: '한 줄 소개 ({SubTitle})'
    example: '단순히 책만 읽는 독서모임이 아닌, 책 속에 빠져 인사이트를 나누는 모임'
  # ----------------------------------------
  # [2] 배지 및 태그 정보
  # ----------------------------------------
  category:
    $ref: ./ClubCategory.yaml
    description: 동아리 카테고리
  division:
    $ref: ./ClubDivision.yaml
    description: 동아리 소속 (단과대·학과·연합 등)
  # ----------------------------------------
  # [3] 메타 데이터 (좋아요/구독)
  # ----------------------------------------
  bookmarkCount:
    type: integer
    description: 동아리 즐겨찾기 수
    example: 128
  isBookmarked:
    type: boolean
    description: 현재 사용자의 동아리 즐겨찾기 여부
    example: true
  # ----------------------------------------
  # [4] 링크 및 위치 정보 (하이퍼링크)
  # ----------------------------------------
  instagramUrl:
    type: string
    description: 인스타그램 프로필 링크 (없으면 null)
    example: 'https://instagram.com/kuring.official'
  # ----------------------------------------
  # [5] 상세 내용
  # ----------------------------------------
  description:
    type: string
    description: '동아리 상세 소개글 ({ClubInfoTextLong}) - 줄바꿈(\n) 포함'
    example: 저희 리드미는 2020년부터 시작된...
  qualifications:
    type: string
    description: 지원 자격 텍스트 (줄바꿈 포함)
    example: |-
      건국대학교 재학생 및 휴학생 누구나
      (매주 목요일 활동 가능하신 분)
  # ----------------------------------------
  # [6] 모집 관련 정보
  # ----------------------------------------
  recruitmentStatus:
    $ref: ./ClubRecruitmentStatus.yaml
    description: 모집 상태 (모집전/모집중/모집완료/상시모집)
  recruitStartAt:
    type: string
    format: date-time
    description: 모집 시작 일시
    example: '2026-03-02T00:00:00'
  recruitEndAt:
    type: string
    format: date-time
    description: 모집 마감 일시 (D-day 계산용)
    example: '2026-03-15T23:59:59'
  applyUrl:
    type: string
    description: 지원하기 버튼 클릭 시 이동할 구글폼 URL
    example: 'https://forms.gle/xyz...'
  posterImageUrl:
    type: string
    description: 동아리 포스터 이미지 URL (없으면 null)
    nullable: true
  location:
    description: 동아리 위치 정보
    $ref: ./ClubLocationDto.yaml
