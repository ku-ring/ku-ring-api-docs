type: object
description: 동아리 목록 응답 (커서 페이징). data는 배열이며 content 키 없이 목록만 반환합니다.
properties:
  data:
    type: array
    items:
      $ref: ./ClubListItemDto.yaml
    description: 동아리 목록 (한 페이지 분)
  cursor:
    type: string
    nullable: true
    description: 다음 페이지 요청 시 사용할 커서 (다음 페이지 없으면 null)
  hasNext:
    type: boolean
    description: 다음 페이지 존재 여부
  totalCount:
    type: integer
    description: |
      총 개수.
      - 목록 조회: 필터 조건에 맞는 전체 동아리 개수
      - 즐겨찾기 목록 조회: 사용자가 즐겨찾기한 동아리 전체 개수
