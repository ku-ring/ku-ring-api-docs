type: object
description: 캠퍼스맵 건물 상세 조회 응답의 data
required:
  - id
  - name
  - address
  - latitude
  - longitude
  - imageUrl
  - currentOperatingHours
  - campusPlaces
properties:
  id:
    type: integer
    format: int64
    description: 건물 ID
    example: 4
  name:
    type: string
    description: 건물명
    example: 학생회관
  address:
    type: string
    description: 건물 주소
    example: 서울특별시 광진구 능동로 120
  latitude:
    type: number
    format: double
    description: 건물 위도
    example: 37.5412
  longitude:
    type: number
    format: double
    description: 건물 경도
    example: 127.0784
  imageUrl:
    type: string
    format: uri
    nullable: true
    description: 건물 이미지 URL. 등록된 이미지가 없으면 null
    example: https://placehold.co/1200x800/png?text=Student+Center
  currentOperatingHours:
    $ref: ./CurrentOperatingHours.yaml
  campusPlaces:
    type: array
    description: 건물에 등록된 주요시설 및 편의시설 목록
    items:
      $ref: ./CampusPlaceDetail.yaml
example:
  id: 4
  name: 학생회관
  address: 서울특별시 광진구 능동로 120
  latitude: 37.5412
  longitude: 127.0784
  imageUrl: https://placehold.co/1200x800/png?text=Student+Center
  currentOperatingHours:
    period: SEMESTER
    dayGroup: WEEKDAY
    status: SCHEDULED
    opensAt: '08:00'
    closesAt: '22:00'
  campusPlaces:
    - id: 101
      name: 학생회관 편의점
      category: convenience_store
      categoryKorName: 편의점
      imageUrl: https://placehold.co/600x400/png?text=Convenience+Store
      locationType: INDOOR
      floor: 1F
      locationDetail: 학생회관 정문 오른쪽
      quantity: null
      currentOperatingHours:
        period: SEMESTER
        dayGroup: WEEKDAY
        status: SCHEDULED
        opensAt: '08:00'
        closesAt: '22:00'
      externalUrl: null
    - id: 103
      name: 신한은행 학생회관 ATM
      category: bank_atm
      categoryKorName: 은행·ATM
      imageUrl: https://placehold.co/600x400/png?text=ATM
      locationType: INDOOR
      floor: 1F
      locationDetail: 서측 출입구 옆
      quantity: 2
      currentOperatingHours:
        period: SEMESTER
        dayGroup: WEEKDAY
        status: OPEN_24_HOURS
        opensAt: null
        closesAt: null
      externalUrl: null