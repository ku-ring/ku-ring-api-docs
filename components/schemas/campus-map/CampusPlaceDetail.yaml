type: object
description: 건물 상세 화면에 포함되는 시설 정보
required:
  - id
  - name
  - category
  - categoryKorName
  - imageUrl
  - locationType
  - floor
  - locationDetail
  - quantity
  - currentOperatingHours
  - externalUrl
properties:
  id:
    type: integer
    format: int64
    description: 시설 ID
    example: 102
  name:
    type: string
    description: 시설명
    example: 학생회관 1층 라운지 프린터
  category:
    type: string
    description: 카테고리 목록 조회 API에서 제공하는 카테고리 코드
    example: printer
  categoryKorName:
    type: string
    description: 카테고리 한글명
    example: 프린터
  imageUrl:
    type: string
    format: uri
    nullable: true
    description: 시설 이미지 URL. 등록된 이미지가 없으면 null
    example: https://placehold.co/600x400/png?text=Printer
  locationType:
    type: string
    description: 시설 위치 유형
    enum:
      - INDOOR
      - OUTDOOR
    example: INDOOR
  floor:
    type: string
    description: 시설이 위치한 층. 외부 시설은 OUTDOOR
    example: 1F
  locationDetail:
    type: string
    nullable: true
    description: 시설의 상세 위치
    example: 라운지 안쪽
  quantity:
    type: integer
    format: int32
    minimum: 1
    nullable: true
    description: 동일 위치에 있는 시설 수량. 수량 개념이 없으면 null
    example: 3
  currentOperatingHours:
    $ref: ./CurrentOperatingHours.yaml
  externalUrl:
    type: string
    format: uri
    nullable: true
    description: 시설 관련 외부 페이지 URL. 연결할 페이지가 없으면 null
    example: https://wein.konkuk.ac.kr/
example:
  id: 102
  name: 학생회관 1층 라운지 프린터
  category: printer
  categoryKorName: 프린터
  imageUrl: https://placehold.co/600x400/png?text=Printer
  locationType: INDOOR
  floor: 1F
  locationDetail: 라운지 안쪽
  quantity: 3
  currentOperatingHours:
    period: SEMESTER
    dayGroup: WEEKDAY
    status: SCHEDULED
    opensAt: '08:00'
    closesAt: '22:00'
  externalUrl: null