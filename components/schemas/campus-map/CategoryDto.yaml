type: object
description: 캠퍼스맵 시설 카테고리 정보
required:
  - name
  - korName
  - displayOrder
properties:
  name:
    type: string
    description: 시설 목록 조회 요청에 사용하는 카테고리 코드
    example: convenience_store
  korName:
    type: string
    description: 클라이언트 화면에 표시할 카테고리 한글명
    example: 편의점
  displayOrder:
    type: integer
    format: int32
    description: 카테고리 화면 노출 순서
    example: 1
