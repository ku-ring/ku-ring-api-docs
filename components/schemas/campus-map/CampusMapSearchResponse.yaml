type: object
description: 캠퍼스맵 건물 및 시설 통합 검색 응답의 data
required:
  - buildings
  - campusPlaces
properties:
  buildings:
    type: array
    description: 검색어와 일치하는 건물 목록
    items:
      $ref: ./BuildingSummary.yaml
  campusPlaces:
    type: array
    description: 검색어와 일치하는 캠퍼스 시설 목록
    items:
      $ref: ./CampusPlaceItem.yaml
