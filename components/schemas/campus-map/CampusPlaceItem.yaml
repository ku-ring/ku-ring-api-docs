type: object
description: 캠퍼스 건물 내부 또는 외부에 있는 시설 정보
required:
  - id
  - name
  - category
  - categoryKorName
  - imageUrl
  - locationType
  - floor
  - locationDetail
  - quantity
  - operatingHours
  - externalUrl
  - building
properties:
  id:
    type: integer
    format: int64
    description: 시설 ID
    example: 301
  name:
    type: string
    description: 시설명
    example: 법학관 인쇄소
  category:
    type: string
    description: |-
      카테고리 목록 조회 API에서 제공하는 시설 필터 코드입니다.
      - `cafe`: 카페
      - `restaurant`: 식당
      - `printer`: 프린터
      - `smoking_booth`: 흡연부스
      - `convenience_store`: 편의점
      - `lounge`: 휴게실
      - `kcube`: K-Cube
    enum:
      - cafe
      - restaurant
      - printer
      - smoking_booth
      - convenience_store
      - lounge
      - kcube
    example: printer
  categoryKorName:
    type: string
    description: 카테고리 표시명
    example: 프린터
  imageUrl:
    type: string
    format: uri
    nullable: true
    description: 시설이 속한 건물의 이미지 URL. 건물 이미지가 없으면 null
    example: https://placehold.co/1200x800/png?text=Law+Building
  locationType:
    type: string
    description: |-
      시설 위치 유형입니다.
      - `INDOOR`: 건물 내부
      - `OUTDOOR`: 건물 외부
    enum:
      - INDOOR
      - OUTDOOR
    example: INDOOR
  floor:
    type: string
    description: 시설이 위치한 층. 외부 시설은 OUTDOOR
    example: B1
  locationDetail:
    type: string
    nullable: true
    description: 시설의 상세 위치
    example: 법학관 지하 1층
  quantity:
    type: integer
    format: int32
    minimum: 1
    nullable: true
    description: 동일 위치에 있는 시설 수량. 수량 개념이 없으면 null
    example: 1
  operatingHours:
    type: array
    description: 기간·요일별 전체 운영시간. 배열 순서와 관계없이 isCurrent가 true인 항목이 현재 적용되는 운영시간
    items:
      $ref: ./OperatingHoursDto.yaml
  externalUrl:
    type: string
    format: uri
    nullable: true
    description: 시설 관련 외부 페이지 URL. 연결할 페이지가 없으면 null
    example: https://wein.konkuk.ac.kr/
  building:
    $ref: ./BuildingSummary.yaml
example:
  id: 301
  name: 법학관 인쇄소
  category: printer
  categoryKorName: 프린터
  imageUrl: https://placehold.co/1200x800/png?text=Law+Building
  locationType: INDOOR
  floor: B1
  locationDetail: 법학관 지하 1층
  quantity: 1
  operatingHours:
    - period: SEMESTER
      dayGroup: WEEKDAY
      status: SCHEDULED
      opensAt: '08:00'
      closesAt: '22:00'
      isCurrent: false
    - period: SEMESTER
      dayGroup: WEEKEND
      status: SCHEDULED
      opensAt: '09:00'
      closesAt: '18:00'
      isCurrent: false
    - period: VACATION
      dayGroup: WEEKDAY
      status: SCHEDULED
      opensAt: '09:00'
      closesAt: '18:00'
      isCurrent: true
    - period: VACATION
      dayGroup: WEEKEND
      status: UNKNOWN
      opensAt: null
      closesAt: null
      isCurrent: false
  externalUrl: null
  building:
    id: 3
    name: 법학관
    address: 서울특별시 광진구 능동로 120
    latitude: 37.5417036
    longitude: 127.0750767