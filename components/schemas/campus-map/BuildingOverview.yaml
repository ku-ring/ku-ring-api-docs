title: BuildingOverview
type: object
description: 캠퍼스맵 전체 건물 목록에 표시되는 건물 정보
required:
  - id
  - name
  - address
  - latitude
  - longitude
  - displayOrder
properties:
  id:
    type: integer
    format: int64
    description: 건물 ID
    example: 35
  name:
    type: string
    description: 건물명
    example: 학생회관
  address:
    type: string
    description: 건물 주소
    example: 서울특별시 광진구 능동로 120
  latitude:
    type: number
    format: double
    description: 건물 위도
    example: 37.541875
  longitude:
    type: number
    format: double
    description: 건물 경도
    example: 127.077966
  displayOrder:
    type: integer
    format: int32
    nullable: true
    description: 건물 노출 우선순위. 값이 없으면 우선순위가 지정된 건물 다음에 노출됩니다.
    example: 1