type: object
description: 캠퍼스맵 건물 요약 정보
required:
  - id
  - name
  - address
  - latitude
  - longitude
  - imageUrl
properties:
  id:
    type: integer
    format: int64
    description: 건물 ID
    example: 4
  name:
    type: string
    description: 건물명
    example: 학생회관
  address:
    type: string
    description: 건물 주소
    example: 서울특별시 광진구 능동로 120
  latitude:
    type: number
    format: double
    description: 건물 위도
    example: 37.541823
  longitude:
    type: number
    format: double
    description: 건물 경도
    example: 127.0779007
  imageUrl:
    type: string
    format: uri
    nullable: true
    description: 건물 이미지 URL. 등록된 이미지가 없으면 null
    example: https://cdn.example.com/campus-map/student-center.jpg
example:
  id: 4
  name: 학생회관
  address: 서울특별시 광진구 능동로 120
  latitude: 37.541823
  longitude: 127.0779007
  imageUrl: https://cdn.example.com/campus-map/student-center.jpg