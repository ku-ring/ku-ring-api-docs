type: object
description: 캠퍼스맵 건물 요약 정보
required:
  - id
  - name
  - address
  - latitude
  - longitude
properties:
  id:
    type: integer
    format: int64
    description: 건물 ID
    example: 4
  name:
    type: string
    description: 건물명
    example: 학생회관
  address:
    type: string
    description: 건물 주소
    example: 서울특별시 광진구 능동로 120
  latitude:
    type: number
    format: double
    description: 건물 위도
    example: 37.5412
  longitude:
    type: number
    format: double
    description: 건물 경도
    example: 127.0784
example:
  id: 4
  name: 학생회관
  address: 서울특별시 광진구 능동로 120
  latitude: 37.5412
  longitude: 127.0784