type: object
description: 서버가 현재 날짜를 기준으로 판단한 운영시간 정보
required:
  - period
  - dayGroup
  - status
  - opensAt
  - closesAt
properties:
  period:
    type: string
    description: 현재 적용된 운영 기간
    enum:
      - SEMESTER
      - VACATION
    example: SEMESTER
  dayGroup:
    type: string
    description: 현재 적용된 요일 구분
    enum:
      - WEEKDAY
      - WEEKEND
    example: WEEKDAY
  status:
    type: string
    description: 현재 운영시간의 제공 상태
    enum:
      - SCHEDULED
      - OPEN_24_HOURS
      - UNKNOWN
    example: SCHEDULED
  opensAt:
    type: string
    nullable: true
    description: 운영 시작 시각. OPEN_24_HOURS 또는 UNKNOWN이면 null
    example: '08:00'
  closesAt:
    type: string
    nullable: true
    description: 운영 종료 시각. OPEN_24_HOURS 또는 UNKNOWN이면 null
    example: '22:00'
example:
  period: SEMESTER
  dayGroup: WEEKDAY
  status: SCHEDULED
  opensAt: '08:00'
  closesAt: '22:00'